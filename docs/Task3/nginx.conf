proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports:10m max_size=1g inactive=1h use_temp_path=off;
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_tokens off;
    # Подписанные ссылки не записываем в логи.
    access_log off;
    error_log /var/log/nginx/error.log crit;
    proxy_pass_request_headers off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    location /reports/ {
        limit_except GET { deny all; }
        # Проверяем доступ до чтения кеша, в том числе при HIT.
        auth_request /_authorize;
        auth_request_set $origin_url $upstream_http_x_origin_url;
        proxy_pass $origin_url;

        proxy_cache reports;
        # Подпись не входит в ключ; владелец и версия входят.
        proxy_cache_key $uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Access-Control-Allow-Origin http://localhost:3000 always;
        add_header Content-Disposition 'attachment; filename="report.json"';
    }

    location = /_authorize {
        internal;
        proxy_pass http://reports-api:8000/cdn-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location / { return 404; }
}
