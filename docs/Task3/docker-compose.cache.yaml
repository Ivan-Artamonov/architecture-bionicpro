services:
  reports-api:
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: reports-api
      S3_SECRET_KEY: ${REPORTS_S3_SECRET_KEY:?Укажите REPORTS_S3_SECRET_KEY}
      CDN_PUBLIC_URL: http://localhost:8082
      CDN_SIGNING_SECRET: ${CDN_SIGNING_SECRET:?Укажите CDN_SIGNING_SECRET}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  airflow-scheduler:
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: reports-etl
      S3_SECRET_KEY: ${ETL_S3_SECRET_KEY:?Укажите ETL_S3_SECRET_KEY}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: dh-mirror.gitverse.ru/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Укажите MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Укажите MINIO_ROOT_PASSWORD}
    volumes:
      - reports-s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: dh-mirror.gitverse.ru/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Укажите MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Укажите MINIO_ROOT_PASSWORD}
      REPORTS_S3_SECRET_KEY: ${REPORTS_S3_SECRET_KEY:?Укажите REPORTS_S3_SECRET_KEY}
      ETL_S3_SECRET_KEY: ${ETL_S3_SECRET_KEY:?Укажите ETL_S3_SECRET_KEY}
    volumes:
      - ./docs/Task3/minio:/config:ro
    depends_on:
      minio:
        condition: service_healthy

  reports-cdn:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./docs/Task3/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - reports-cdn-cache:/var/cache/nginx/reports
    depends_on: [reports-api]

volumes:
  reports-s3-data:
  reports-cdn-cache:
