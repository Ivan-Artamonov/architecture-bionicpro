worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports:10m max_size=100m inactive=1h;
    # Не записываем code, session id и путь персонального отчёта в access log.
    access_log off;
    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        location /id/ { proxy_pass http://keycloak:8080; }
        location /auth/ { proxy_pass http://bionicpro-auth:8000; }
        location = /reports { proxy_pass http://bionicpro-auth:8000; }
        location = /_check_report {
            internal;
            proxy_pass http://bionicpro-auth:8000/internal/check-report;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Internal-Key local-internal-key;
        }
        location /cdn/ {
            # auth_request выполняется до выдачи кеша. S3 bucket закрыт.
            auth_request /_check_report;
            auth_request_set $session_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $session_cookie always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "private, no-store" always;
            proxy_hide_header Cache-Control;
            proxy_hide_header Set-Cookie;
            proxy_set_header Cookie "";
            proxy_set_header X-Internal-Key local-internal-key;
            proxy_pass http://reports-api:8000/internal/objects/;
            proxy_cache reports;
            proxy_cache_key $uri;
            proxy_cache_valid 200 1h;
            proxy_cache_lock on;
        }
        location /internal/ { return 404; }
        location / { proxy_pass http://frontend:80; }
    }
}
