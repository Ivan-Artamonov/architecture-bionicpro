version: '3.8'

services:
  openldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: BionicPRO foreign office
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD in .env}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:?Set LDAP_CONFIG_PASSWORD in .env}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_PASSWORD:?Set LDAP_READONLY_PASSWORD in .env}
      # Local Docker stand only; use trusted LDAPS/StartTLS outside the stand.
      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "", "-s", "base", "namingContexts"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: http://localhost:8080
      BIONICPRO_AUTH_CLIENT_SECRET: ${BIONICPRO_AUTH_CLIENT_SECRET:?Set BIONICPRO_AUTH_CLIENT_SECRET in .env}
      LDAP_READONLY_PASSWORD: ${LDAP_READONLY_PASSWORD:?Set LDAP_READONLY_PASSWORD in .env}
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_started
      openldap:
        condition: service_healthy
  auth-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  bionicpro-auth:
    build: ./bionicpro-auth
    environment:
      BIONICPRO_AUTH_CLIENT_SECRET: ${BIONICPRO_AUTH_CLIENT_SECRET:?Set BIONICPRO_AUTH_CLIENT_SECRET in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
      APP_ORIGIN: http://localhost:3000
      OIDC_ISSUER: http://localhost:8080/realms/reports-realm
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/reports-realm
      REDIS_URL: redis://auth-redis:6379/0
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REPORTS_API_URL: ${REPORTS_API_URL:-}
    depends_on:
      auth-redis:
        condition: service_healthy
      keycloak:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

volumes:
  ldap-data:
  ldap-config:
