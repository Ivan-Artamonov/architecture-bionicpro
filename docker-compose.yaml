services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
    volumes: [keycloak_data:/var/lib/postgresql/data]
  keycloak:
    build: ./keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KC_HOSTNAME_URL: http://localhost:8080
    command: [start-dev, --import-realm]
    volumes:
      - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports: ["8080:8080"]
    depends_on: [keycloak_db]
  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionicpro.ldif:ro
    command: [--copy-service]
  crm_db:
    image: postgres:14
    command: [postgres, -c, wal_level=logical]
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-crm_password}
    volumes:
      - crm_data:/var/lib/postgresql/data
      - ./crm/init:/docker-entrypoint-initdb.d:ro
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  kafka-connect:
    image: debezium/connect:2.7.3.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
    ports: ["8083:8083"]
    depends_on: [kafka, crm_db]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: reports_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bionicpro_clickhouse_dev}
    ports: ["8123:8123"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    depends_on: [kafka]
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bionicpro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bionicpro_dev_password}
    ports: ["9001:9001"]
    volumes: [minio_data:/data]
  minio-init:
    build: ./report-api
    depends_on: [minio]
    command: python init_bucket.py
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: reports
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bionicpro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bionicpro_dev_password}
  auth:
    build: ./bionicpro-auth
    environment:
      PUBLIC_ORIGIN: http://localhost:3000
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-bionicpro-dev-client-secret}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Set SESSION_ENCRYPTION_KEY in .env}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}
      COOKIE_SECURE: 'false' # localhost-only demo; true behind HTTPS
    depends_on: [keycloak]
  api:
    build: ./report-api
    environment:
      AUTH_INTERNAL_URL: http://auth:8001
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in .env}
      REPORT_LINK_SECRET: ${REPORT_LINK_SECRET:?Set REPORT_LINK_SECRET in .env}
      CLICKHOUSE_URL: http://reports_user:${CLICKHOUSE_PASSWORD:-bionicpro_clickhouse_dev}@clickhouse:8123/?database=bionicpro
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: reports
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bionicpro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bionicpro_dev_password}
      COOKIE_SECURE: 'false'
    depends_on: [auth, clickhouse, minio]
  cdn:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [auth, api, cdn]
  airflow:
    build: ./airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      CLICKHOUSE_URL: http://reports_user:${CLICKHOUSE_PASSWORD:-bionicpro_clickhouse_dev}@clickhouse:8123/?database=bionicpro
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
    ports: ["8085:8080"]
    depends_on: [clickhouse]
volumes:
  keycloak_data:
  crm_data:
  clickhouse_data:
  minio_data:
